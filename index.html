<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsLive Liquid Glass Hub</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0E14">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    :root {
      --bg-color: #0B0E14;
      --glass-bg: rgba(22, 28, 45, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-glow: rgba(0, 162, 255, 0.15);
      --accent-red: #E52533;
      --accent-green: #00E676;
      --text-main: #F0F4F8;
      --text-muted: #8A99AD;
      --header-bg: rgba(11, 14, 20, 0.85);
      --modal-bg: rgba(15, 20, 32, 0.95);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 65px;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: #FFF;
    }

    .brand span {
      color: var(--accent-red);
    }

    .pwa-btn {
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(229, 37, 51, 0.1);
      color: var(--accent-red);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--accent-red);
      box-shadow: 0 0 12px rgba(229, 37, 51, 0.6), inset 0 0 6px rgba(229, 37, 51, 0.4);
      text-shadow: 0 0 6px rgba(229, 37, 51, 0.8);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pwa-btn:hover {
      box-shadow: 0 0 18px rgba(229, 37, 51, 0.9), inset 0 0 10px rgba(229, 37, 51, 0.6);
    }

    .pwa-btn.active {
      background: rgba(0, 230, 118, 0.1);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.6), inset 0 0 6px rgba(0, 230, 118, 0.4);
      text-shadow: 0 0 6px rgba(0, 230, 118, 0.8);
    }

    .pwa-btn.active:hover {
      box-shadow: 0 0 18px rgba(0, 230, 118, 0.9), inset 0 0 10px rgba(0, 230, 118, 0.6);
    }

    .app-container {
      display: flex;
      flex: 1;
      width: 100%;
    }

    .sidebar {
      position: sticky;
      top: 65px;
      height: calc(100vh - 65px);
      width: 230px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--glass-border);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      padding: 0 20px 10px 20px;
    }

    .sport-link {
      padding: 10px 20px;
      color: var(--text-main);
      font-weight: 300;
      font-size: 0.9rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sport-link:hover, .sport-link.active {
      background: rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-red);
      font-weight: 700;
    }

    .content-area {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .date-scroller {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .date-chip {
      padding: 8px 16px;
      border-radius: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-weight: 300;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .date-chip.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: #FFF;
      color: #FFF;
      font-weight: 700;
    }

    .scoreboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .score-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .score-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px 0 var(--glass-glow);
    }

    .score-card.is-final {
      opacity: 0.45;
      filter: grayscale(80%);
      order: 999;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
    }

    .action-btn.pinned {
      color: #FFD700;
      border-color: #FFD700;
    }

    .action-btn.alert-active {
      color: #00E676;
      border-color: #00E676;
      box-shadow: 0 0 6px rgba(0, 230, 118, 0.4);
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .team-name {
      font-size: 0.95rem;
      font-weight: 400;
    }

    .team-score {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .leading-score {
      color: var(--accent-green);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-red);
      text-transform: uppercase;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      width: 100%;
      max-width: 1200px;
      height: 600px;
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .modal-header {
      height: 45px;
      padding: 0 20px;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
    }

    .modal-title {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-body {
      display: flex;
      flex: 1;
      height: calc(100% - 45px);
    }

    .player-section {
      flex: 0 0 75%;
      background: #000;
      position: relative;
    }

    .player-section iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .details-section {
      flex: 0 0 25%;
      background: rgba(255, 255, 255, 0.02);
      border-left: 1px solid var(--glass-border);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 300;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .sources-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .source-btn {
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .source-btn:hover {
      background: var(--accent-red);
    }

    @media (max-width: 900px) {
      .app-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        top: 0;
        flex-direction: row;
        overflow-x: auto;
        padding: 10px;
      }
      .modal-container {
        height: 90vh;
      }
      .modal-body {
        flex-direction: column;
      }
      .player-section {
        flex: 0 0 60%;
      }
      .details-section {
        flex: 0 0 40%;
        border-left: none;
        border-top: 1px solid var(--glass-border);
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      SPORTS<span>HUB</span>
    </div>
    <button id="pwaAlertBtn" class="pwa-btn">
      <span id="btnIcon">⏻</span> <span id="btnText">Enable Push Alerts</span>
    </button>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-title">Categories</div>
      <div class="sport-link active" onclick="switchSport('all', 'all', this)">All Sports</div>
      <div class="sport-link" onclick="switchSport('baseball', 'mlb', this)">Baseball (MLB)</div>
      <div class="sport-link" onclick="switchSport('basketball', 'nba', this)">Basketball (NBA)</div>
      <div class="sport-link" onclick="switchSport('basketball', 'mens-college-basketball', this)">College Hoops (NCAAM)</div>
      <div class="sport-link" onclick="switchSport('football', 'college-football', this)">College Gridiron (NCAAF)</div>
      <div class="sport-link" onclick="switchSport('football', 'nfl', this)">Football (NFL)</div>
      <div class="sport-link" onclick="switchSport('hockey', 'nhl', this)">Hockey (NHL)</div>
      <div class="sport-link" onclick="switchSport('mma', 'ufc', this)">MMA (UFC)</div>
      <div class="sport-link" onclick="switchSport('soccer', 'usa.1', this)">Soccer (MLS)</div>
      <div class="sport-link" onclick="switchSport('soccer', 'eng.1', this)">Soccer (EPL)</div>
    </aside>

    <main class="content-area">
      <div class="date-scroller" id="dateScroller"></div>
      <div class="scoreboard-grid" id="scoreboardGrid"></div>
    </main>
  </div>

  <div class="modal-overlay" id="streamModal">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Match Stream</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="player-section">
          <iframe id="streamPlayer" src="" allowfullscreen></iframe>
        </div>
        <div class="details-section" id="modalDetails"></div>
      </div>
    </div>
  </div>

  <script src="streamed.js"></script>

  <script>
    const BACK4APP_APP_ID = "obf7aTUggazRscBY140M2kWTRbhcuiintFMuuh7M";
    const BACK4APP_JS_KEY = "byBfXw4lc8QrxfDxzscc6KoH0oejmLubmusyGowa";
    const VAPID_PUBLIC_KEY = "BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E";

    const ALL_SPORTS_LEAGUES = [
      { sport: 'football', league: 'nfl' },
      { sport: 'basketball', league: 'nba' },
      { sport: 'baseball', league: 'mlb' },
      { sport: 'hockey', league: 'nhl' },
      { sport: 'mma', league: 'ufc' },
      { sport: 'soccer', league: 'usa.1' },
      { sport: 'soccer', league: 'eng.1' },
      { sport: 'football', league: 'college-football' },
      { sport: 'basketball', league: 'mens-college-basketball' }
    ];

    let currentSport = 'all';
    let currentLeague = 'all';
    let selectedDate = formatDateForESPN(new Date());
    let alertSelectedGames = new Set();
    let pinnedGames = new Set();
    let cachedEventsList = [];
    let isPushEnabled = false;

    function formatDateForESPN(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}${mm}${dd}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Register Service Worker for Web Push
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('Service Worker registration note:', err);
        });
      }

      setupDateScroller();
      initPushAlertButton();
      loadUserAlertsFromBack4App();
      fetchScoreboard();
      
      setInterval(() => {
        if (alertSelectedGames.size > 0) {
          fetchScoreboard();
        }
      }, 240000);

      setInterval(() => {
        if (cachedEventsList.length > 0) {
          renderCards(cachedEventsList);
        }
      }, 60000);
    });

    function initPushAlertButton() {
      const btn = document.getElementById('pwaAlertBtn');
      btn.onclick = togglePushAlerts;
    }

    async function togglePushAlerts() {
      const btn = document.getElementById('pwaAlertBtn');
      const btnText = document.getElementById('btnText');

      if (!isPushEnabled) {
        if ('Notification' in window) {
          const permission = await Notification.requestPermission();
          if (permission === 'granted') {
            await subscribeUserToPush();
          }
        }
        isPushEnabled = true;
        btn.classList.add('active');
        btnText.innerText = 'Push Alerts Active';
      } else {
        isPushEnabled = false;
        btn.classList.remove('active');
        btnText.innerText = 'Enable Push Alerts';
      }
    }

    async function subscribeUserToPush() {
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.ready;
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: VAPID_PUBLIC_KEY
          });
          
          const keyP256dh = sub.getKey ? btoa(String.fromCharCode.apply(null, new Uint8Array(sub.getKey('p256dh')))) : '';
          const keyAuth = sub.getKey ? btoa(String.fromCharCode.apply(null, new Uint8Array(sub.getKey('auth')))) : '';

          await fetch('https://parseapi.back4app.com/classes/_Installation', {
            method: 'POST',
            headers: {
              'X-Parse-Application-Id': BACK4APP_APP_ID,
              'X-Parse-REST-API-Key': BACK4APP_JS_KEY,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              deviceType: 'push',
              pushToken: sub.endpoint,
              channels: Array.from(alertSelectedGames),
              keys: {
                p256dh: keyP256dh,
                auth: keyAuth
              }
            })
          });
        } catch (err) {
          console.warn('Back4App Push Installation Note:', err);
        }
      }
    }

    async function syncGameAlertToBack4App(gameId, isAlertActive) {
      try {
        await fetch('https://parseapi.back4app.com/classes/GameAlerts', {
          method: 'POST',
          headers: {
            'X-Parse-Application-Id': BACK4APP_APP_ID,
            'X-Parse-REST-API-Key': BACK4APP_JS_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            gameId: gameId,
            alertActive: isAlertActive,
            timestamp: new Date().toISOString()
          })
        });
      } catch (err) {
        console.warn('Back4App Sync Error:', err);
      }
    }

    async function loadUserAlertsFromBack4App() {
      try {
        const res = await fetch('https://parseapi.back4app.com/classes/GameAlerts?limit=100&order=-createdAt', {
          headers: {
            'X-Parse-Application-Id': BACK4APP_APP_ID,
            'X-Parse-REST-API-Key': BACK4APP_JS_KEY
          }
        }).then(r => r.json());

        if (res && res.results) {
          res.results.forEach(item => {
            if (item.alertActive) {
              alertSelectedGames.add(item.gameId);
            }
          });
          if (cachedEventsList.length > 0) {
            renderCards(cachedEventsList);
          }
        }
      } catch (err) {
        console.warn('Back4App fetch error:', err);
      }
    }

    function setupDateScroller() {
      const scroller = document.getElementById('dateScroller');
      scroller.innerHTML = '';
      const today = new Date();

      for (let i = -2; i <= 4; i++) {
        const d = new Date();
        d.setDate(today.getDate() + i);
        const dateFormatted = formatDateForESPN(d);

        const chip = document.createElement('div');
        chip.className = `date-chip ${i === 0 ? 'active' : ''}`;
        chip.innerText = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        
        chip.onclick = () => {
          document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          selectedDate = dateFormatted;
          fetchScoreboard();
        };
        scroller.appendChild(chip);
      }
    }

    function switchSport(sport, league, element) {
      document.querySelectorAll('.sport-link').forEach(l => l.classList.remove('active'));
      element.classList.add('active');
      currentSport = sport;
      currentLeague = league;
      fetchScoreboard();
    }

    async function fetchScoreboard() {
      const grid = document.getElementById('scoreboardGrid');
      
      try {
        let fetchPromises = [];

        if (currentSport === 'all') {
          fetchPromises = ALL_SPORTS_LEAGUES.map(item => 
            fetch(`https://site.api.espn.com/apis/site/v2/sports/${item.sport}/${item.league}/scoreboard?dates=${selectedDate}`)
              .then(r => r.json())
              .then(data => data.events || [])
              .catch(() => [])
          );
        } else {
          const espnUrl = `https://site.api.espn.com/apis/site/v2/sports/${currentSport}/${currentLeague}/scoreboard?dates=${selectedDate}`;
          fetchPromises.push(
            fetch(espnUrl)
              .then(r => r.json())
              .then(data => data.events || [])
              .catch(() => [])
          );
        }

        const [eventsResults] = await Promise.all([
          Promise.all(fetchPromises),
          fetchLiveStreams()
        ]);

        const aggregatedEvents = eventsResults.flat();
        cachedEventsList = aggregatedEvents;
        
        renderCards(aggregatedEvents);
      } catch (err) {
        grid.innerHTML = '<div style="color:var(--text-muted)">Failed to load schedule/scores for this date.</div>';
      }
    }

    function getStartsInCountdown(eventDateStr) {
      const startTime = new Date(eventDateStr);
      const now = new Date();
      const diffMs = startTime - now;

      if (diffMs <= 0) {
        return startTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }

      const diffMins = Math.floor(diffMs / 60000);
      const hours = Math.floor(diffMins / 60);
      const mins = diffMins % 60;

      if (hours > 0) {
        return `Starts in ${hours}h ${mins}m`;
      } else {
        return `Starts in ${mins}m`;
      }
    }

    function renderCards(events) {
      const grid = document.getElementById('scoreboardGrid');
      grid.innerHTML = '';

      if (!events || events.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-muted); padding: 20px;">No games scheduled for this date.</div>';
        return;
      }

      events.sort((a, b) => {
        const aPinned = pinnedGames.has(a.id) ? 1 : 0;
        const bPinned = pinnedGames.has(b.id) ? 1 : 0;
        if (aPinned !== bPinned) return bPinned - aPinned;

        const aFinal = a.status?.type?.completed ? 1 : 0;
        const bFinal = b.status?.type?.completed ? 1 : 0;
        return aFinal - bFinal;
      });

      events.forEach(event => {
        const competition = event.competitions?.[0];
        if (!competition) return;

        const home = competition.competitors?.find(c => c.homeAway === 'home') || competition.competitors?.[0];
        const away = competition.competitors?.find(c => c.homeAway === 'away') || competition.competitors?.[1];
        
        if (!home || !away) return;

        const isCompleted = event.status?.type?.completed;
        const isPinned = pinnedGames.has(event.id);
        const hasAlert = alertSelectedGames.has(event.id);

        const homeScore = parseInt(home.score || '0');
        const awayScore = parseInt(away.score || '0');

        let statusDisplay = '';
        if (isCompleted) {
          statusDisplay = 'FINAL';
        } else if (event.status?.type?.state === 'in') {
          statusDisplay = event.status?.type?.detail || 'LIVE';
        } else {
          statusDisplay = getStartsInCountdown(event.date);
        }

        const card = document.createElement('div');
        card.className = `score-card ${isCompleted ? 'is-final' : ''}`;
        card.onclick = (e) => {
          if (!e.target.classList.contains('action-btn')) {
            openModal(event, competition);
          }
        };

        card.innerHTML = `
          <div class="card-header">
            <span class="status-badge">${statusDisplay}</span>
            <div class="card-actions">
              <button class="action-btn ${hasAlert ? 'alert-active' : ''}" onclick="toggleAlert('${event.id}', event)">
                ${hasAlert ? 'Alert On' : 'Alert Off'}
              </button>
              <button class="action-btn ${isPinned ? 'pinned' : ''}" onclick="togglePin('${event.id}', event)">
                ${isPinned ? 'Pinned' : 'Pin'}
              </button>
            </div>
          </div>

          <div class="team-row">
            <div class="team-info">
              <img class="team-logo" src="${home.team?.logo || ''}" alt="">
              <span class="team-name">${home.team?.displayName || 'TBD'}</span>
            </div>
            <span class="team-score ${homeScore > awayScore && !isCompleted ? 'leading-score' : ''}">${home.score || 0}</span>
          </div>

          <div class="team-row">
            <div class="team-info">
              <img class="team-logo" src="${away.team?.logo || ''}" alt="">
              <span class="team-name">${away.team?.displayName || 'TBD'}</span>
            </div>
            <span class="team-score ${awayScore > homeScore && !isCompleted ? 'leading-score' : ''}">${away.score || 0}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function togglePin(id, e) {
      e.stopPropagation();
      if (pinnedGames.has(id)) pinnedGames.delete(id);
      else pinnedGames.add(id);
      fetchScoreboard();
    }

    function toggleAlert(id, e) {
      e.stopPropagation();
      let isNowActive = false;
      if (alertSelectedGames.has(id)) {
        alertSelectedGames.delete(id);
      } else {
        alertSelectedGames.add(id);
        isNowActive = true;
      }
      syncGameAlertToBack4App(id, isNowActive);
      fetchScoreboard();
    }

    async function openModal(event, competition) {
      const modal = document.getElementById('streamModal');
      const title = document.getElementById('modalTitle');
      const details = document.getElementById('modalDetails');
      const player = document.getElementById('streamPlayer');

      const home = competition.competitors?.find(c => c.homeAway === 'home') || competition.competitors?.[0];
      const away = competition.competitors?.find(c => c.homeAway === 'away') || competition.competitors?.[1];

      const homeName = home?.team?.displayName || 'Home Team';
      const awayName = away?.team?.displayName || 'Away Team';

      title.innerText = `${homeName} vs ${awayName}`;
      player.src = "about:blank";

      details.innerHTML = `
        <div class="stat-box">
          <div class="stat-label">Scoreboard</div>
          <div class="stat-value">
            <span class="${parseInt(home?.score || 0) > parseInt(away?.score || 0) ? 'leading-score' : ''}">${home?.team?.abbreviation || 'HOME'} ${home?.score || 0}</span> - 
            <span class="${parseInt(away?.score || 0) > parseInt(home?.score || 0) ? 'leading-score' : ''}">${away?.team?.abbreviation || 'AWAY'} ${away?.score || 0}</span>
          </div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Game Details</div>
          <div class="stat-value" style="font-size:0.9rem; font-weight:400;">
            ${currentSport === 'baseball' ? 'Balls / Strikes / Out Outlines' : 'In-game context stats'}
          </div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Available Stream Sources</div>
          <div class="sources-list" id="sourcesList">
            <span style="color:var(--text-muted);">Searching for active streams...</span>
          </div>
        </div>
      `;

      modal.classList.add('active');

      let matchedStream = findMatchingStream(home?.team, away?.team);

      if (!matchedStream) {
        await fetchLiveStreams();
        matchedStream = findMatchingStream(home?.team, away?.team);
      }

      const sourcesContainer = document.getElementById('sourcesList');

      if (matchedStream && matchedStream.sources && matchedStream.sources.length > 0) {
        sourcesContainer.innerHTML = '';
        matchedStream.sources.forEach((src) => {
          const btn = document.createElement('button');
          btn.className = 'source-btn';
          btn.innerText = `Source ${src.source.toUpperCase()} (${src.hd ? 'HD' : 'SD'})`;
          btn.onclick = () => loadStreamSource(src.source, src.id);
          sourcesContainer.appendChild(btn);
        });

        loadStreamSource(matchedStream.sources[0].source, matchedStream.sources[0].id);
      } else {
        sourcesContainer.innerHTML = `<span style="color:var(--accent-red); font-size:0.85rem;">No active stream sources online for this game right now.</span>`;
      }
    }

    async function loadStreamSource(source, id) {
      const player = document.getElementById('streamPlayer');
      const embedUrl = await fetchStreamEmbedUrl(source, id);
      if (embedUrl) {
        player.src = embedUrl;
      }
    }

    function closeModal() {
      const modal = document.getElementById('streamModal');
      const player = document.getElementById('streamPlayer');
      player.src = "";
      modal.classList.remove('active');
    }
  </script>
</body>
</html>
