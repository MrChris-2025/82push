<html lang="en">
<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    :root {
      --bg-color: #0B0E14;
      --glass-bg: rgba(22, 28, 45, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-glow: rgba(0, 162, 255, 0.15);
      --accent-red: #E52533;
      --accent-green: #00E676;
      --text-main: #F0F4F8;
      --text-muted: #8A99AD;
      --header-bg: rgba(11, 14, 20, 0.85);
      --modal-bg: rgba(15, 20, 32, 0.95);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 65px;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: #FFF;
    }

    .brand span {
      color: var(--accent-red);
    }

    .pwa-btn {
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(229, 37, 51, 0.1);
      color: var(--accent-red);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--accent-red);
      box-shadow: 0 0 12px rgba(229, 37, 51, 0.6), inset 0 0 6px rgba(229, 37, 51, 0.4);
      text-shadow: 0 0 6px rgba(229, 37, 51, 0.8);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pwa-btn:hover {
      box-shadow: 0 0 18px rgba(229, 37, 51, 0.9), inset 0 0 10px rgba(229, 37, 51, 0.6);
    }

    .pwa-btn.active {
      background: rgba(0, 230, 118, 0.1);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.6), inset 0 0 6px rgba(0, 230, 118, 0.4);
      text-shadow: 0 0 6px rgba(0, 230, 118, 0.8);
    }

    .pwa-btn.active:hover {
      box-shadow: 0 0 18px rgba(0, 230, 118, 0.9), inset 0 0 10px rgba(0, 230, 118, 0.6);
    }

    .app-container {
      display: flex;
      flex: 1;
      width: 100%;
    }

    .sidebar {
      position: sticky;
      top: 65px;
      height: calc(100vh - 65px);
      width: 230px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--glass-border);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      padding: 0 20px 10px 20px;
    }

    .sport-link {
      padding: 10px 20px;
      color: var(--text-main);
      font-weight: 300;
      font-size: 0.9rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sport-link:hover, .sport-link.active {
      background: rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-red);
      font-weight: 700;
    }

    .content-area {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .date-scroller {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .date-chip {
      padding: 8px 16px;
      border-radius: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-weight: 300;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .date-chip.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: #FFF;
      color: #FFF;
      font-weight: 700;
    }

    .scoreboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .score-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px 0 var(--glass-glow);
    }

    .score-card.is-final {
      opacity: 0.45;
      filter: grayscale(80%);
      order: 999;
    }

      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
    }

    .action-btn.pinned {
      color: #FFD700;
      border-color: #FFD700;
    }

    .action-btn.alert-active {
      color: #00E676;
      border-color: #00E676;
      box-shadow: 0 0 6px rgba(0, 230, 118, 0.4);
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .team-name {
      font-size: 0.95rem;
      font-weight: 400;
    }

    .team-score {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .leading-score {
      color: var(--accent-green);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-red);
      text-transform: uppercase;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      width: 100%;
      max-width: 1200px;
      height: 600px;
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);

    .modal-header {

      justify-content: space-between;
      align-items: center;

    .modal-title {

    .modal-close {
      background: none;

      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-body {
      display: flex;
      flex: 1;
      height: calc(100% - 45px);

    .player-section {
      flex: 0 0 75%;
      background: #000;

    }

    .player-section iframe {
      width: 100%;
      height: 100%;

    .details-section {
      flex: 0 0 25%;

      border-left: 1px solid var(--glass-border);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;

    .stat-box {

    .stat-label {

    .stat-value {

    .sources-list {

    .source-btn {

    @media (max-width: 900px) {

        border-top: 1px solid var(--glass-border);
      }
    }
  </style>

  <script src="streamed.js"></script>

  <!-- ====== NON-INVASIVE SERVER-FIRST PUSH BRIDGE (NO localStorage) ======
       - Does NOT modify streamed.js.
       - Uses Cloud Functions: saveSubscription, updateSubscriptionChannels, removeSubscription.
       - Restores UI from server by querying PushSubscription by endpointHash.
       - Place at end of page so inline app variables/functions exist.
  ====================================================================== -->
  <script>
  (function () {
    // Helpers
    function callFn(name, body) {
      return fetch('https://parseapi.back4app.com/functions/' + name, {
        method: 'POST',
        headers: {
          'X-Parse-Application-Id': BACK4APP_APP_ID,
          'X-Parse-JavaScript-Key': BACK4APP_JS_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body || {})
      }).then(r => r.json().catch(()=>({ ok:false, status: r.status })));
    }

    function callParseREST(path, method = 'GET', body) {
      const url = 'https://parseapi.back4app.com' + path;
      const opts = { method, headers: { 'X-Parse-Application-Id': BACK4APP_APP_ID, 'X-Parse-JavaScript-Key': BACK4APP_JS_KEY } };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      return fetch(url, opts).then(r => r.json().catch(()=>null));
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    // compute sha256 hex via SubtleCrypto; fallback to base64 slice if unavailable
    async function sha256Hex(input) {
      try {
        if (window.crypto && crypto.subtle && crypto.subtle.digest) {
          const enc = new TextEncoder();
          const buf = enc.encode(String(input || ''));
          const hash = await crypto.subtle.digest('SHA-256', buf);
          const arr = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
          return arr;
        }
      } catch (e) { console.warn('crypto digest failed', e); }
      try { return btoa(unescape(encodeURIComponent(String(input||'')))).slice(0,64); } catch(e){ return String(input||'').slice(0,64); }
    }

    async function ensureSubscription() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        const vapid = (typeof VAPID_PUBLIC_KEY !== 'undefined') ? VAPID_PUBLIC_KEY : window.VAPID_PUBLIC_KEY;
        if (!vapid) return null;
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(vapid) });
      }
      return sub;
    }

    // Parse gameId from a button's onclick attribute: toggleAlert('GAMEID', event)
    function extractGameIdFromButton(btn) {
      try {
        const onclick = btn.getAttribute && btn.getAttribute('onclick');
        if (!onclick) return null;
        const m = onclick.match(/toggleAlert\(\s*'([^']+)'/);
        if (m && m[1]) return m[1];
        const m2 = onclick.match(/toggleAlert\(\s*"([^"]+)"/);
        if (m2 && m2[1]) return m2[1];
      } catch (e) {}
      return null;
    }

    // Update DOM to reflect channels returned from server (does NOT call streamed.js toggle functions)
    function applyChannelsToUI(channels) {
      try {
        // remove alert-active from all alert buttons
        document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('alert-active'));
        // For each channel, find the button that toggles it and add alert-active
        const btns = Array.from(document.querySelectorAll('.action-btn'));
        channels.forEach(ch => {
          for (const b of btns) {
            const id = extractGameIdFromButton(b);
            if (String(id) === String(ch)) {
              b.classList.add('alert-active');
              break;
            }
          }
        });
      } catch (e) {
        console.warn('applyChannelsToUI error', e);
      }
    }

    // Restore state from backend by querying PushSubscription by endpointHash
    async function restoreStateFromServer() {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (!sub || !sub.endpoint) return;

        const hash = await sha256Hex(sub.endpoint);
        const where = encodeURIComponent(JSON.stringify({ endpointHash: String(hash) }));
        const res = await callParseREST('/classes/PushSubscription?where=' + where, 'GET');
        if (res && Array.isArray(res.results) && res.results.length) {
          const s = res.results[0];
          if (s && Array.isArray(s.channels)) {
            applyChannelsToUI(s.channels);
            // mark PWA button active since subscription exists server-side
            const pwaBtn = document.getElementById('pwaAlertBtn');
            const btnText = document.getElementById('btnText');
            if (pwaBtn) pwaBtn.classList.add('active');
            if (btnText) btnText.innerText = 'Push Alerts Active';
          }
        }
      } catch (e) {
        console.warn('restoreStateFromServer error', e);
      }
    }

    // When the pwa button is clicked, allow streamed.js to handle permission request
    // Then ensure subscription exists and call saveSubscription server function with current channels.
    document.addEventListener('click', function(ev) {
      try {
        const t = ev.target;
        if (!t) return;
        if (t.id === 'pwaAlertBtn' || (t.closest && t.closest('#pwaAlertBtn'))) {
          setTimeout(async () => {
            try {
              if (Notification.permission !== 'granted') return;
              const sub = await ensureSubscription();
              if (!sub) return;
              // collect channels by checking buttons marked alert-active (streamed.js manages classes)
              const activeBtns = Array.from(document.querySelectorAll('.action-btn.alert-active'));
              const channels = activeBtns.map(b => extractGameIdFromButton(b)).filter(Boolean).map(String);
              await callFn('saveSubscription', { subscription: sub, channels: channels, platform: navigator.userAgent });
              // reflect on UI (pwa button)
              const pwaBtn = document.getElementById('pwaAlertBtn'); const btnText = document.getElementById('btnText');
              if (pwaBtn) pwaBtn.classList.add('active');
              if (btnText) btnText.innerText = 'Push Alerts Active';
            } catch (e) {
              console.warn('pwa helper error', e);
            }
          }, 600);
        }
      } catch (e) {}
    }, { passive: true });

    // When an alert button is clicked, after streamed.js toggles class, update server channels via Cloud Function.
    document.addEventListener('click', function(ev) {
      try {
        const btn = ev.target && ev.target.closest && ev.target.closest('.action-btn') ? ev.target.closest('.action-btn') : (ev.target && ev.target.classList && ev.target.classList.contains('action-btn') ? ev.target : null);
        if (!btn) return;

        // Determine gameId from the button's onclick attribute
        const gameId = extractGameIdFromButton(btn);
        if (!gameId) return;

        // Wait slightly for streamed.js to update classes
        setTimeout(async () => {
          try {
            const isActive = btn.classList.contains('alert-active');
            let sub = null;
            try { sub = await ensureSubscription(); } catch(e){ sub = null; }
            if (!sub && isActive) {
              // If user enabled alert but no subscription exists yet, create one and save
              try { sub = await ensureSubscription(); } catch(e){ sub = null; }
            }
            if (!sub) {
              // no subscription to update on server — still record GameAlerts via existing backend call in streamed.js
              return;
            }
            const action = isActive ? 'add' : 'remove';
            await callFn('updateSubscriptionChannels', { subscription: sub, gameId: String(gameId), action: action, platform: navigator.userAgent });
          } catch (e) {
            console.warn('update channels error', e);
          }
        }, 150);
      } catch (e) {}
    }, { passive: true });

    // Optionally handle explicit unsubscribe flow (if you add a "turn off all push" control)
    async function removeSubscriptionServerSide() {
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (!sub) return;
        await callFn('removeSubscription', { subscription: sub });
        // Optionally unsubscribe client-side too:
        try { await sub.unsubscribe(); } catch(e) {}
        const pwaBtn = document.getElementById('pwaAlertBtn'); const btnText = document.getElementById('btnText');
        if (pwaBtn) pwaBtn.classList.remove('active');
        if (btnText) btnText.innerText = 'Enable Push Alerts';
      } catch (e) { console.warn('removeSubscriptionServerSide error', e); }
    }

    // Run restore after load (ensure streamed.js and inline app code executed)
    window.addEventListener('load', function() {
      // give a short delay to ensure service worker is registered by streamed.js
      setTimeout(() => {
        restoreStateFromServer().catch(e => console.warn('restoreStateFromServer top error', e));
      }, 800);
    });

    // Expose removeSubscriptionServerSide if you want to call it from console or add UI later
    window.removeSubscriptionServerSide = removeSubscriptionServerSide;
  })();
  </script>
  <!-- ====== end server-first push bridge ====== -->

  <script>

    function formatDateForESPN(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}${mm}${dd}`;
    }

    // generateInstallationId no longer persists in localStorage (server identifies subscriptions by endpointHash)
    function generateInstallationId() {
      return 'inst-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    document.addEventListener("DOMContentLoaded", () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('Service Worker registration note:', err);
        });
      }

      setupDateScroller();
      initPushAlertButton();
      loadUserAlertsFromBack4App();
      fetchScoreboard();
      
      setInterval(() => {
        if (alertSelectedGames.size > 0) {
          fetchScoreboard();
        }
      }, 240000);

      setInterval(() => {
        if (cachedEventsList.length > 0) {
          renderCards(cachedEventsList);
        }
      }, 60000);
    });

    function initPushAlertButton() {
      const btn = document.getElementById('pwaAlertBtn');
      btn.onclick = togglePushAlerts;
    }

    async function togglePushAlerts() {
      const btn = document.getElementById('pwaAlertBtn');
      const btnText = document.getElementById('btnText');

      if (!isPushEnabled) {
        if ('Notification' in window) {
          const permission = await Notification.requestPermission();
          if (permission === 'granted') {
            await subscribeUserToPush();
          }
        }
        isPushEnabled = true;
        btn.classList.add('active');
        btnText.innerText = 'Push Alerts Active';
      } else {
        isPushEnabled = false;
        btn.classList.remove('active');
        btnText.innerText = 'Enable Push Alerts';
      }
    }

    // Updated subscribeUserToPush: uses server Cloud Function saveSubscription; no localStorage
    async function subscribeUserToPush() {
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.ready;
          // convert VAPID key
          const applicationServerKey = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
          let sub = await reg.pushManager.getSubscription();
          if (!sub) {
            sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey });
          }
          if (!sub) return;

          // gather channels from UI (buttons with alert-active)
          const activeBtns = Array.from(document.querySelectorAll('.action-btn.alert-active'));
          const channels = activeBtns.map(b => {
            const onclick = b.getAttribute && b.getAttribute('onclick');
            if (!onclick) return null;
            const m = onclick.match(/toggleAlert\(\s*'([^']+)'/);
            if (m && m[1]) return String(m[1]);
            const m2 = onclick.match(/toggleAlert\(\s*"([^"]+)"/);
            if (m2 && m2[1]) return String(m2[1]);
            return null;
          }).filter(Boolean);

          // Call Cloud Function to save subscription server-side
          await fetch('https://parseapi.back4app.com/functions/saveSubscription', {
            method: 'POST',
            headers: {
              'X-Parse-Application-Id': BACK4APP_APP_ID,
              'X-Parse-JavaScript-Key': BACK4APP_JS_KEY,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ subscription: sub, channels: channels, platform: navigator.userAgent })
          }).catch(e => { console.warn('saveSubscription call failed', e); });

        } catch (err) {
          console.warn('subscribeUserToPush error:', err);
        }
      }
    }

    async function syncGameAlertToBack4App(gameId, isAlertActive) {
      try {
        // keep the existing GameAlerts analytics logging
        await fetch('https://parseapi.back4app.com/classes/GameAlerts', {
          method: 'POST',
          headers: {
            'X-Parse-Application-Id': BACK4APP_APP_ID,
            'X-Parse-JavaScript-Key': BACK4APP_JS_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            gameId: String(gameId),
            alertActive: isAlertActive,
            timestamp: {
              "__type": "Date",
              "iso": new Date().toISOString()
            }
          })
        }).catch(()=>{});
      } catch (err) {
        console.warn('Back4App Sync Error:', err);
      }
    }

    async function loadUserAlertsFromBack4App() {
      try {
        const res = await fetch('https://parseapi.back4app.com/classes/GameAlerts?limit=100&order=-createdAt', {
          headers: {
            'X-Parse-Application-Id': BACK4APP_APP_ID,
            'X-Parse-JavaScript-Key': BACK4APP_JS_KEY
          }
        }).then(r => r.json());

        if (res && res.results) {
          res.results.forEach(item => {
            if (item.alertActive) {
              alertSelectedGames.add(item.gameId);
            }
          });
          if (cachedEventsList.length > 0) {
            renderCards(cachedEventsList);
          }
        }
      } catch (err) {
        console.warn('Back4App fetch error:', err);
      }
    }

    function setupDateScroller() {
      const scroller = document.getElementById('dateScroller');
      scroller.innerHTML = '';
      const today = new Date();

      for (let i = -2; i <= 4; i++) {
        const d = new Date();
        d.setDate(today.getDate() + i);
        const dateFormatted = formatDateForESPN(d);

        const chip = document.createElement('div');
        chip.className = `date-chip ${i === 0 ? 'active' : ''}`;
        chip.innerText = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        
        chip.onclick = () => {
          document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          selectedDate = dateFormatted;
          fetchScoreboard();
        };
        scroller.appendChild(chip);
      }
    }

    function switchSport(sport, league, element) {
      document.querySelectorAll('.sport-link').forEach(l => l.classList.remove('active'));
      element.classList.add('active');
      currentSport = sport;
      currentLeague = league;
      fetchScoreboard();
    }

    async function fetchScoreboard() {
      const grid = document.getElementById('scoreboardGrid');
      
      try {
        let fetchPromises = [];

        if (currentSport === 'all') {
          fetchPromises = ALL_SPORTS_LEAGUES.map(item => 
            fetch(`https://site.api.espn.com/apis/site/v2/sports/${item.sport}/${item.league}/scoreboard?dates=${selectedDate}`)
              .then(r => r.json())
              .then(data => data.events || [])
              .catch(() => [])
          );
        } else {
          const espnUrl = `https://site.api.espn.com/apis/site/v2/sports/${currentSport}/${currentLeague}/scoreboard?dates=${selectedDate}`;
          fetchPromises.push(
            fetch(espnUrl)
              .then(r => r.json())
              .then(data => data.events || [])
              .catch(() => [])
          );
        }

        const [eventsResults] = await Promise.all([
          Promise.all(fetchPromises),
          typeof fetchLiveStreams === 'function' ? fetchLiveStreams() : Promise.resolve([])
        ]);

        const aggregatedEvents = eventsResults.flat();
        cachedEventsList = aggregatedEvents;
        
        renderCards(aggregatedEvents);
      } catch (err) {
        grid.innerHTML = '<div style="color:var(--text-muted)">Failed to load schedule/scores for this date.</div>';
      }
    }

    function getStartsInCountdown(eventDateStr) {
      const startTime = new Date(eventDateStr);
      const now = new Date();
      const diffMs = startTime - now;

      if (diffMs <= 0) {
        return startTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }

      const diffMins = Math.floor(diffMs / 60000);
      const hours = Math.floor(diffMins / 60);
      const mins = diffMins % 60;

      if (hours > 0) {
        return `Starts in ${hours}h ${mins}m`;
      } else {
        return `Starts in ${mins}m`;
      }
    }

    function renderCards(events) {
      const grid = document.getElementById('scoreboardGrid');
      grid.innerHTML = '';

      if (!events || events.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-muted); padding: 20px;">No games scheduled for this date.</div>';
        return;
      }

      events.sort((a, b) => {
        const aPinned = pinnedGames.has(a.id) ? 1 : 0;
        const bPinned = pinnedGames.has(b.id) ? 1 : 0;
        if (aPinned !== bPinned) return bPinned - aPinned;

        const aFinal = a.status?.type?.completed ? 1 : 0;
        const bFinal = b.status?.type?.completed ? 1 : 0;
        return aFinal - bFinal;
      });

      events.forEach(event => {
        const competition = event.competitions?.[0];
        if (!competition) return;

        const home = competition.competitors?.find(c => c.homeAway === 'home') || competition.competitors?.[0];
        const away = competition.competitors?.find(c => c.homeAway === 'away') || competition.competitors?.[1];
        
        if (!home || !away) return;

        const isCompleted = event.status?.type?.completed;
        const isPinned = pinnedGames.has(event.id);
        const hasAlert = alertSelectedGames.has(event.id);

        const homeScore = parseInt(home.score || '0');
        const awayScore = parseInt(away.score || '0');

        let statusDisplay = '';
        if (isCompleted) {
          statusDisplay = 'FINAL';
        } else if (event.status?.type?.state === 'in') {
          statusDisplay = event.status?.type?.detail || 'LIVE';
        } else {
          statusDisplay = getStartsInCountdown(event.date);
        }

        const card = document.createElement('div');
        card.className = `score-card ${isCompleted ? 'is-final' : ''}`;
        card.onclick = (e) => {
          if (!e.target.classList.contains('action-btn')) {
            openModal(event, competition);
          }
        };

        card.innerHTML = `
          <div class="card-header">
            <span class="status-badge">${statusDisplay}</span>
            <div class="card-actions">
              <button class="action-btn ${hasAlert ? 'alert-active' : ''}" onclick="toggleAlert('${event.id}', event)">
                ${hasAlert ? 'Alert On' : 'Alert Off'}
              </button>
              <button class="action-btn ${isPinned ? 'pinned' : ''}" onclick="togglePin('${event.id}', event)">
                ${isPinned ? 'Pinned' : 'Pin'}
              </button>
            </div>
          </div>

          <div class="team-row">
            <div class="team-info">
              <img class="team-logo" src="${home.team?.logo || ''}" alt="">
              <span class="team-name">${home.team?.displayName || 'TBD'}</span>
            </div>
            <span class="team-score ${homeScore > awayScore && !isCompleted ? 'leading-score' : ''}">${home.score || 0}</span>
          </div>

          <div class="team-row">
            <div class="team-info">
              <img class="team-logo" src="${away.team?.logo || ''}" alt="">
              <span class="team-name">${away.team?.displayName || 'TBD'}</span>
            </div>
            <span class="team-score ${awayScore > homeScore && !isCompleted ? 'leading-score' : ''}">${away.score || 0}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function togglePin(id, e) {
      e.stopPropagation();
      if (pinnedGames.has(id)) pinnedGames.delete(id);
      else pinnedGames.add(id);
      fetchScoreboard();
    }

    function toggleAlert(id, e) {
      e.stopPropagation();
      let isNowActive = false;
      if (alertSelectedGames.has(id)) {
        alertSelectedGames.delete(id);
      } else {
        alertSelectedGames.add(id);
        isNowActive = true;
      }
      // Keep analytics record on GameAlerts
      syncGameAlertToBack4App(id, isNowActive);
      // Server channel update is performed by the server-first helper above (no localStorage)
      fetchScoreboard();
    }

    async function openModal(event, competition) {
      const modal = document.getElementById('streamModal');
      const title = document.getElementById('modalTitle');
      const details = document.getElementById('modalDetails');
      const player = document.getElementById('streamPlayer');

      const home = competition.competitors?.find(c => c.homeAway === 'home') || competition.competitors?.[0];
      const away = competition.competitors?.find(c => c.homeAway === 'away') || competition.competitors?.[1];

      const homeName = home?.team?.displayName || 'Home Team';
      const awayName = away?.team?.displayName || 'Away Team';

      title.innerText = `${homeName} vs ${awayName}`;
      player.src = "about:blank";

      details.innerHTML = `
        <div class="stat-box">
          <div class="stat-label">Scoreboard</div>
          <div class="stat-value">
            <span class="${parseInt(home?.score || 0) > parseInt(away?.score || 0) ? 'leading-score' : ''}">${home?.team?.abbreviation || 'HOME'} ${home?.score || 0}</span> - 
            <span class="${parseInt(away?.score || 0) > parseInt(home?.score || 0) ? 'leading-score' : ''}">${away?.team?.abbreviation || 'AWAY'} ${away?.score || 0}</span>
          </div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Game Details</div>
          <div class="stat-value" style="font-size:0.9rem; font-weight:400;">
            ${currentSport === 'baseball' ? 'Balls / Strikes / Out Outlines' : 'In-game context stats'}
          </div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Available Stream Sources</div>
          <div class="sources-list" id="sourcesList">
            <span style="color:var(--text-muted);">Searching for active streams...</span>
          </div>
        </div>
      `;

      modal.classList.add('active');

      let matchedStream = typeof findMatchingStream === 'function' ? findMatchingStream(home?.team, away?.team) : null;

      if (!matchedStream && typeof fetchLiveStreams === 'function') {
        await fetchLiveStreams();
        matchedStream = findMatchingStream(home?.team, away?.team);
      }

      const sourcesContainer = document.getElementById('sourcesList');

      if (matchedStream && matchedStream.sources && matchedStream.sources.length > 0) {
        sourcesContainer.innerHTML = '';
        matchedStream.sources.forEach((src) => {
          const btn = document.createElement('button');
          btn.className = 'source-btn';
          btn.innerText = `Source ${src.source.toUpperCase()} (${src.hd ? 'HD' : 'SD'})`;
          btn.onclick = () => loadStreamSource(src.source, src.id);
          sourcesContainer.appendChild(btn);
        });

        loadStreamSource(matchedStream.sources[0].source, matchedStream.sources[0].id);
      } else {
        sourcesContainer.innerHTML = `<span style="color:var(--accent-red); font-size:0.85rem;">No active stream sources online for this game right now.</span>`;
      }
    }

    async function loadStreamSource(source, id) {
      const player = document.getElementById('streamPlayer');
      const embedUrl = typeof fetchStreamEmbedUrl === 'function' ? await fetchStreamEmbedUrl(source, id) : null;
      if (embedUrl) {
        player.src = embedUrl;
      }
    }

    function closeModal() {
      const modal = document.getElementById('streamModal');
      const player = document.getElementById('streamPlayer');
      player.src = "";
      modal.classList.remove('active');
    }
  </script>
</body>
