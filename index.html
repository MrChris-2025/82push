<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsLive Liquid Glass Hub</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0E14">

  <script src="https://cdn.jsdelivr.net/npm/vconsole@latest/dist/vconsole.min.js"></script>
  <script>var vConsole = new VConsole();</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    :root {
      --bg-color: #0B0E14;
      --glass-bg: rgba(22, 28, 45, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-glow: rgba(0, 162, 255, 0.15);
      --accent-red: #E52533;
      --accent-green: #00E676;
      --text-main: #F0F4F8;
      --text-muted: #8A99AD;
      --header-bg: rgba(11, 14, 20, 0.85);
      --modal-bg: rgba(15, 20, 32, 0.95);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 65px;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: #FFF;
    }

    .brand span {
      color: var(--accent-red);
    }

    .pwa-btn {
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(229, 37, 51, 0.1);
      color: var(--accent-red);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--accent-red);
      box-shadow: 0 0 12px rgba(229, 37, 51, 0.6), inset 0 0 6px rgba(229, 37, 51, 0.4);
      text-shadow: 0 0 6px rgba(229, 37, 51, 0.8);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pwa-btn:hover {
      box-shadow: 0 0 18px rgba(229, 37, 51, 0.9), inset 0 0 10px rgba(229, 37, 51, 0.6);
    }

    .pwa-btn.active {
      background: rgba(0, 230, 118, 0.1);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.6), inset 0 0 6px rgba(0, 230, 118, 0.4);
      text-shadow: 0 0 6px rgba(0, 230, 118, 0.8);
    }

    .pwa-btn.active:hover {
      box-shadow: 0 0 18px rgba(0, 230, 118, 0.9), inset 0 0 10px rgba(0, 230, 118, 0.6);
    }

    .app-container {
      display: flex;
      flex: 1;
      width: 100%;
    }

    .sidebar {
      position: sticky;
      top: 65px;
      height: calc(100vh - 65px);
      width: 230px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--glass-border);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      padding: 0 20px 10px 20px;
    }

    .sport-link {
      padding: 10px 20px;
      color: var(--text-main);
      font-weight: 300;
      font-size: 0.9rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sport-link:hover, .sport-link.active {
      background: rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-red);
      font-weight: 700;
    }

    .content-area {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .date-scroller {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .date-chip {
      padding: 8px 16px;
      border-radius: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-weight: 300;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .date-chip.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: #FFF;
      color: #FFF;
      font-weight: 700;
    }

    .scoreboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .score-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .score-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px 0 var(--glass-glow);
    }

    .score-card.is-final {
      opacity: 0.45;
      filter: grayscale(80%);
      order: 999;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
    }

    .action-btn.pinned {
      color: #FFD700;
      border-color: #FFD700;
    }

    .action-btn.alert-active {
      color: #00E676;
      border-color: #00E676;
      box-shadow: 0 0 6px rgba(0, 230, 118, 0.4);
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .team-name {
      font-size: 0.95rem;
      font-weight: 400;
    }

    .team-score {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .leading-score {
      color: var(--accent-green);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-red);
      text-transform: uppercase;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      width: 100%;
      max-width: 1200px;
      height: 600px;
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .modal-header {
      height: 45px;
      padding: 0 20px;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
    }

    .modal-title {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-body {
      display: flex;
      flex: 1;
      height: calc(100% - 45px);
    }

    .player-section {
      flex: 0 0 75%;
      background: #000;
      position: relative;
    }

    .player-section iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .details-section {
      flex: 0 0 25%;
      background: rgba(255, 255, 255, 0.02);
      border-left: 1px solid var(--glass-border);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 300;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .sources-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .source-btn {
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .source-btn:hover {
      background: var(--accent-red);
    }

    @media (max-width: 900px) {
      .app-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        top: 0;
        flex-direction: row;
        overflow-x: auto;
        padding: 10px;
      }
      .modal-container {
        height: 90vh;
      }
      .modal-body {
        flex-direction: column;
      }
      .player-section {
        flex: 0 0 60%;
      }
      .details-section {
        flex: 0 0 40%;
        border-left: none;
        border-top: 1px solid var(--glass-border);
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      SPORTS<span>HUB</span>
    </div>
    <button id="pwaAlertBtn" class="pwa-btn">
      <span id="btnIcon">⏻</span> <span id="btnText">Enable Push Alerts</span>
    </button>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-title">Categories</div>
      <div class="sport-link active" onclick="switchSport('all', 'all', this)">All Sports</div>
      <div class="sport-link" onclick="switchSport('baseball', 'mlb', this)">Baseball (MLB)</div>
      <div class="sport-link" onclick="switchSport('basketball', 'nba', this)">Basketball (NBA)</div>
      <div class="sport-link" onclick="switchSport('basketball', 'mens-college-basketball', this)">College Hoops (NCAAM)</div>
      <div class="sport-link" onclick="switchSport('football', 'college-football', this)">College Gridiron (NCAAF)</div>
      <div class="sport-link" onclick="switchSport('football', 'nfl', this)">Football (NFL)</div>
      <div class="sport-link" onclick="switchSport('hockey', 'nhl', this)">Hockey (NHL)</div>
      <div class="sport-link" onclick="switchSport('mma', 'ufc', this)">MMA (UFC)</div>
      <div class="sport-link" onclick="switchSport('soccer', 'usa.1', this)">Soccer (MLS)</div>
      <div class="sport-link" onclick="switchSport('soccer', 'eng.1', this)">Soccer (EPL)</div>
    </aside>

    <main class="content-area">
      <div class="date-scroller" id="dateScroller"></div>
      <div class="scoreboard-grid" id="scoreboardGrid"></div>
    </main>
  </div>

  <div class="modal-overlay" id="streamModal">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Match Stream</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="player-section">
          <iframe id="streamPlayer" src="" allowfullscreen></iframe>
        </div>
        <div class="details-section" id="modalDetails"></div>
      </div>
    </div>
  </div>

  <script src="streamed.js"></script>

  <!--
    Non-invasive push-bridge: does NOT modify streamed.js or your VAPID keys.
    Paste this after streamed.js. It monkey-patches the UI handlers at runtime,
    saves full PushSubscription objects to Back4App PushSubscription class, and
    keeps subscription channels in sync when user toggles alerts.
  -->
  <script>
  (function() {
    document.addEventListener('DOMContentLoaded', () => {
      // Utilities (safe to use even if some globals are not present)
      function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
          outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
      }
      function generateInstallationId() {
        let id = localStorage.getItem('parse_installation_id');
        if (!id) {
          id = 'inst-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
          localStorage.setItem('parse_installation_id', id);
        }
        return id;
      }
      function getBack4AppKeys() {
        // streamed.js defines constants like BACK4APP_APP_ID at top-level.
        // Safely read them (typeof checks avoid ReferenceError).
        const appId = (typeof BACK4APP_APP_ID !== 'undefined') ? BACK4APP_APP_ID : (window.BACK4APP_APP_ID || null);
        const jsKey = (typeof BACK4APP_JS_KEY !== 'undefined') ? BACK4APP_JS_KEY : (window.BACK4APP_JS_KEY || null);
        return { appId, jsKey };
      }
      async function saveSubscriptionToServer(subscription, channels) {
        const { appId, jsKey } = getBack4AppKeys();
        if (!appId || !jsKey) {
          console.warn('push-bridge: missing Back4App keys');
          return null;
        }
        const installationId = generateInstallationId();
        const objectId = localStorage.getItem('push_objectId');
        const body = {
          subscription: subscription,
          installationId: installationId,
          platform: navigator.userAgent,
          channels: channels || []
        };
        const base = 'https://parseapi.back4app.com/classes/PushSubscription';
        const headers = {
          'X-Parse-Application-Id': appId,
          'X-Parse-JavaScript-Key': jsKey,
          'Content-Type': 'application/json'
        };
        try {
          if (objectId) {
            const res = await fetch(`${base}/${objectId}`, { method: 'PUT', headers, body: JSON.stringify(body) });
            if (res.ok) return objectId;
            // fallthrough to create
          }
          const createRes = await fetch(base, { method: 'POST', headers, body: JSON.stringify(body) });
          const data = await createRes.json().catch(()=>null);
          if (data && data.objectId) {
            localStorage.setItem('push_objectId', data.objectId);
            return data.objectId;
          }
        } catch (e) {
          console.warn('push-bridge: saveSubscriptionToServer error', e);
        }
        return null;
      }
      async function updateChannelsOnServer(channels) {
        const objectId = localStorage.getItem('push_objectId');
        if (!objectId) return;
        const { appId, jsKey } = getBack4AppKeys();
        if (!appId || !jsKey) return;
        try {
          await fetch(`https://parseapi.back4app.com/classes/PushSubscription/${objectId}`, {
            method: 'PUT',
            headers: {
              'X-Parse-Application-Id': appId,
              'X-Parse-JavaScript-Key': jsKey,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ channels })
          });
        } catch (e) {
          console.warn('push-bridge: updateChannelsOnServer error', e);
        }
      }

      // Monkey-patch togglePushAlerts (if present) to ensure full subscription saved.
      if (typeof window.togglePushAlerts === 'function') {
        const orig = window.togglePushAlerts;
        window.togglePushAlerts = async function patchedTogglePushAlerts(...args) {
          try {
            // Let original run (UI / permission request)
            const result = orig.apply(this, args);

            // If permission not granted yet, wait a tick and re-check
            if (Notification.permission !== 'granted') {
              // original likely asked for permission; wait a short moment
              await new Promise(r => setTimeout(r, 600));
              if (Notification.permission !== 'granted') return result;
            }

            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
              console.warn('push-bridge: Push/ServiceWorker not supported');
              return result;
            }
            const reg = await navigator.serviceWorker.ready;

            // Try to get existing subscription first
            let subscription = await reg.pushManager.getSubscription();
            if (!subscription) {
              // Use VAPID public key from page (do NOT change it)
              const vapid = (typeof VAPID_PUBLIC_KEY !== 'undefined') ? VAPID_PUBLIC_KEY : window.VAPID_PUBLIC_KEY;
              const applicationServerKey = vapid ? urlBase64ToUint8Array(vapid) : null;
              subscription = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey
              });
            }

            // Determine current channels from alertSelectedGames (safe typeof check)
            const channels = (typeof alertSelectedGames !== 'undefined' && alertSelectedGames instanceof Set)
              ? Array.from(alertSelectedGames) : [];

            await saveSubscriptionToServer(subscription, channels);
            return result;
          } catch (e) {
            console.warn('push-bridge: patchedTogglePushAlerts error', e);
            try { return orig.apply(this, args); } catch(_) { return null; }
          }
        };
      }

      // Monkey-patch toggleAlert to update channels server-side after user action
      if (typeof window.toggleAlert === 'function') {
        const orig = window.toggleAlert;
        window.toggleAlert = function patchedToggleAlert(...args) {
          const res = orig.apply(this, args);
          try {
            const channels = (typeof alertSelectedGames !== 'undefined' && alertSelectedGames instanceof Set)
              ? Array.from(alertSelectedGames) : [];
            // fire & forget
            updateChannelsOnServer(channels);
          } catch (e) {
            console.warn('push-bridge: toggleAlert patch error', e);
          }
          return res;
        };
      }

      // If already subscribed and channels loaded, push channels to server
      try {
        if (localStorage.getItem('push_objectId')) {
          const channels = (typeof alertSelectedGames !== 'undefined' && alertSelectedGames instanceof Set)
            ? Array.from(alertSelectedGames) : [];
          if (channels.length) updateChannelsOnServer(channels);
        }
      } catch (e) {}
    });
  })();
  </script>

  <script>
    const BACK4APP_APP_ID = "obf7aTUggazRscBY140M2kWTRbhcuiintFMuuh7M";
    const BACK4APP_JS_KEY = "byBfXw4lc8QrxfDxzscc6KoH0oejmLubmusyGowa";
    const VAPID_PUBLIC_KEY = "BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E";
  </script>

  <script>
    // existing in-page script (your original app code continues unchanged)
  </script>
</body>
</html>
