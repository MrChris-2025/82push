  <!--
    Minimal safe helper (non-invasive):
    - Does NOT modify streamed.js directly
    - Subscribes & saves the full PushSubscription on the user's action (pwaAlertBtn)
    - Sends an additional GameAlerts row with installationId (so GameAlerts.installationId won't be undefined)
    - Updates PushSubscription.channels when the user toggles alerts
  -->
  <script>
  (function() {
    // helpers
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }
    function generateInstallationId() {
      let id = localStorage.getItem('parse_installation_id');
      if (!id) {
        id = 'inst-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem('parse_installation_id', id);
      }
      return id;
    }
    function getBack4AppKeys() {
      const appId = (typeof BACK4APP_APP_ID !== 'undefined') ? BACK4APP_APP_ID : (window.BACK4APP_APP_ID || null);
      const jsKey = (typeof BACK4APP_JS_KEY !== 'undefined') ? BACK4APP_JS_KEY : (window.BACK4APP_JS_KEY || null);
      return { appId, jsKey };
    }

    async function getOrCreateSubscription() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        const vapid = (typeof VAPID_PUBLIC_KEY !== 'undefined') ? VAPID_PUBLIC_KEY : window.VAPID_PUBLIC_KEY;
        if (!vapid) { console.warn('Missing VAPID_PUBLIC_KEY'); return null; }
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapid)
        });
      }
      return sub;
    }

    async function saveSubscriptionToParse(subscription, channels=[]) {
      const { appId, jsKey } = getBack4AppKeys();
      if (!appId || !jsKey) { console.warn('Missing Back4App keys'); return null; }
      const installationId = generateInstallationId();
      const objectId = localStorage.getItem('push_objectId');

      const body = {
        subscription: subscription,
        installationId: installationId,
        platform: navigator.userAgent,
        channels: channels
      };

      const base = 'https://parseapi.back4app.com/classes/PushSubscription';
      const headers = {
        'X-Parse-Application-Id': appId,
        'X-Parse-JavaScript-Key': jsKey,
        'Content-Type': 'application/json'
      };

      try {
        if (objectId) {
          const res = await fetch(`${base}/${objectId}`, { method: 'PUT', headers, body: JSON.stringify(body) });
          if (res.ok) return objectId;
          // fallback to create
        }
        const createRes = await fetch(base, { method: 'POST', headers, body: JSON.stringify(body) });
        const data = await createRes.json().catch(()=>null);
        if (data && data.objectId) {
          localStorage.setItem('push_objectId', data.objectId);
          return data.objectId;
        }
      } catch (e) {
        console.warn('saveSubscriptionToParse error', e);
      }
      return null;
    }

    async function updateChannelsOnParse(channels=[]) {
      const objectId = localStorage.getItem('push_objectId');
      if (!objectId) return;
      const { appId, jsKey } = getBack4AppKeys();
      if (!appId || !jsKey) return;
      try {
        await fetch(`https://parseapi.back4app.com/classes/PushSubscription/${objectId}`, {
          method: 'PUT',
          headers: {
            'X-Parse-Application-Id': appId,
            'X-Parse-JavaScript-Key': jsKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ channels })
        });
      } catch (e) {
        console.warn('updateChannelsOnParse error', e);
      }
    }

    // When user clicks Enable Push Alerts, attempt to subscribe and save PushSubscription
    document.addEventListener('DOMContentLoaded', () => {
      const pwaBtn = document.getElementById('pwaAlertBtn');
      if (pwaBtn) {
        pwaBtn.addEventListener('click', () => {
          // let streamed.js toggling/permission run first
          setTimeout(async () => {
            try {
              if (Notification.permission !== 'granted') return;
              const sub = await getOrCreateSubscription();
              if (!sub) return;
              const channels = (typeof alertSelectedGames !== 'undefined' && alertSelectedGames instanceof Set) ? Array.from(alertSelectedGames) : [];
              await saveSubscriptionToParse(sub, channels);
            } catch (e) { console.warn('pwa helper error', e); }
          }, 700);
        }, { passive: true });
      }

      // Update channels on Parse when user clicks action buttons (toggle alert / pin)
      document.addEventListener('click', (ev) => {
        try {
          const target = ev.target;
          if (!target) return;
          if (target.classList && target.classList.contains('action-btn')) {
            setTimeout(() => {
              const channels = (typeof alertSelectedGames !== 'undefined' && alertSelectedGames instanceof Set) ? Array.from(alertSelectedGames) : [];
              updateChannelsOnParse(channels);
            }, 250);
          }
        } catch (e) {}
      }, { passive: true });

      // Also post an extra GameAlerts record including installationId to ensure linkage
      if (typeof syncGameAlertToBack4App === 'function') {
        const orig = syncGameAlertToBack4App;
        window.syncGameAlertToBack4App = async function wrappedSync(gameId, isAlertActive) {
          // call original first
          try { orig.apply(this, arguments); } catch (e) {}
          // fire-and-forget extra record with installationId
          try {
            const { appId, jsKey } = getBack4AppKeys();
            if (!appId || !jsKey) return;
            const installationId = generateInstallationId();
            await fetch('https://parseapi.back4app.com/classes/GameAlerts', {
              method: 'POST',
              headers: {
                'X-Parse-Application-Id': appId,
                'X-Parse-JavaScript-Key': jsKey,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                gameId: String(gameId),
                alertActive: !!isAlertActive,
                installationId: installationId,
                timestamp: { "__type": "Date", "iso": new Date().toISOString() }
              })
            });
          } catch (e) { console.warn('wrapped SyncGameAlert error', e); }
        };
      }
    });
  })();
  </script>
